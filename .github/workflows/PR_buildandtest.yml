name: Strepsuis_seq Docker build and CI test

on: 
  pull_request:
     branches:
       - main
     paths:
       - 'Dockerfile'

jobs:
  Build:
    permissions:
      contents: read
    runs-on: ubuntu:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Docker Login
        uses: docker/login-action@v4.4.0
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: defradigital/strepsuis-seq:${{ github.head_ref }}


  CI_testing:
    permissions:
      contents: read
    runs-on: ubuntu:latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3.0.0
        with:
          version: '25.04.8'

      - name: Set secrets
        run:
            nextflow secrets set BRANCH ${{ github.head_ref }}

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - name: Run Tests
        run: 
          nf-test test --ci
        
