name: Strepsuis_seq Docker build and CI test

on: 
  pull_request:
     branches:
       - main
     paths:
       - '**'
       - '!Dockerfile'

jobs:
  CI_testing:
    permissions:
      contents: read
    runs-on: ubuntu:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3.0.0
        with:
          version: '25.04.8'
 
      - name: Set secrets
        run:
          nextflow secrets set BRANCH "latest"

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - name: Run Tests
        run: 
          nf-test test --ci
        
